<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page introuvable · GDG Marseille</title>
    <meta name="description" content="Cette page n'existe pas ou a été déplacée. Retrouvez les événements, l'équipe et les moyens de soutenir le GDG Marseille." />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/ui-kit.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        .nf { min-height: 56vh; display: flex; align-items: center; padding: 64px 0; }
        .nf h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.15; margin: 8px 0 16px; color: #202124; }
        .nf p { max-width: 560px; color: #4b5563; font-size: 18px; margin: 0 0 24px; }
        .nf-code { color: #1967d2; font-weight: 700; letter-spacing: .06em; }
        .nf-actions { display: flex; flex-wrap: wrap; gap: 12px; }
    </style>
    <link rel="stylesheet" href="/css/motion.css" />
</head>
<body>
    <div id="header-container"></div>
    <main class="nf">
        <div class="container">
            <span class="nf-code">ERREUR 404</span>
            <h1>Cette page est introuvable</h1>
            <p>Le lien est peut-être ancien ou mal écrit. Voici où aller ensuite.</p>
            <div class="nf-actions">
                <a href="/" class="btn-primary">Retour à l'accueil</a>
                <a href="/evenements" class="btn-secondary">Voir les événements</a>
                <a href="/contact" class="btn-secondary">Nous contacter</a>
            </div>
        </div>
    </main>
    <div id="footer-container"></div>
    <script src="/js/main.js"></script>
</body>
</html>
